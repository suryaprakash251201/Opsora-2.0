<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Opsora — home-lab infrastructure dashboard and control center"
    />
    <title>Opsora</title>
    <script>
      // Apply persisted theme before first paint (avoids dark/light flash).
      try {
        var saved = JSON.parse(localStorage.getItem("opsora-ui") || "{}");
        var theme = saved && saved.state && saved.state.theme === "light" ? "light" : "dark";
        var accent = saved && saved.state && saved.state.accent ? saved.state.accent : "sky";
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.accent = accent;
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
